version: 2

sources:
  - name: olist_raw
    schema: "{{ 'public' if target.name == 'dev' else target.schema }}"
    tables:
      - name: orders
      - name: customers
      - name: order_items
      - name: order_payments
      - name: order_reviews
      - name: products
      - name: sellers

      - name: Seed test data
        run: dbt seed

      - name: Run dbt build
        run: dbt build
